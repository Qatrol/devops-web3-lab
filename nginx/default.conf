server {
    listen 80 default_server;
    server_name localhost 192.168.1.103;
    resolver 127.0.0.11 valid=10s;

    # Возвращаем заглушку, так как старого кошелька больше нет
    location / {
        return 200 'Qatrol DevOps Lab. Go to http://glance.local';
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    server_name glance.local;
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream_glance http://glance:8080;
        proxy_pass $upstream_glance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
