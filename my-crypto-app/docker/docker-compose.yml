services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: bun-eth-anvil
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "1"]
    ports:
      - "3007:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bun-eth-api
    ports:
      - "3006:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - ANVIL_NODE=http://anvil:8545
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - CHAIN_ID=31337
    depends_on:
      anvil:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: bun-eth-web
    ports:
      - "3005:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_ANVIL_PORT=3007
      - NEXT_PUBLIC_WC_PROJECT_ID=1234567890abcdef1234567890abcdef
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - ../tooling:/app/tooling
      - /app/node_modules
      - /app/apps/web/node_modules

networks:
  default:
    name: bun-eth-network
