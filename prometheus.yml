global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: name
        regex: '(.+)'
        replacement: '$1'
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
